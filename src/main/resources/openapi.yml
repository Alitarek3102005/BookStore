openapi: 3.0.3
info:
  title: Bookstore REST API
  description: API contract for the Spring Boot Bookstore System, matching the ERD (User, Orders, OrderItem, Book, Category).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: Users
    description: User registration and management
  - name: Orders
    description: Order processing
  - name: OrderItems
    description: Individual line items within an order
  - name: Books
    description: Book catalog management
  - name: Categories
    description: Category management for books
paths:
  /api/users:
    get:
      tags: [Users]
      summary: Get all users
      operationId: getAllUsers
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      tags: [Users]
      summary: Register a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      summary: Get a user by ID
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Users]
      summary: Fully update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    patch:
      tags: [Users]
      summary: Partially update a user
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: User patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found

  /api/orders:
    get:
      tags: [Orders]
      summary: Get all orders
      operationId: getAllOrders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
    post:
      tags: [Orders]
      summary: Place a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Orders]
      summary: Get an order by ID
      operationId: getOrderById
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
    put:
      tags: [Orders]
      summary: Fully update an order
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
    patch:
      tags: [Orders]
      summary: Partially update an order (e.g. status)
      operationId: patchOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPatchRequest'
      responses:
        '200':
          description: Order patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
    delete:
      tags: [Orders]
      summary: Cancel or delete an order
      operationId: deleteOrder
      responses:
        '204':
          description: Order deleted successfully
        '404':
          description: Order not found

  /api/users/{userId}/orders:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Orders]
      summary: Get all orders for a specific user
      operationId: getOrdersByUser
      responses:
        '200':
          description: A list of orders belonging to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: User not found

  /api/order-items:
    get:
      tags: [OrderItems]
      summary: Get all order items
      operationId: getAllOrderItems
      responses:
        '200':
          description: A list of order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItemResponse'
    post:
      tags: [OrderItems]
      summary: Create a new order item
      operationId: createOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '201':
          description: Order item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'

  /api/order-items/{orderItemId}:
    parameters:
      - name: orderItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OrderItems]
      summary: Get an order item by ID
      operationId: getOrderItemById
      responses:
        '200':
          description: Order item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order item not found
    put:
      tags: [OrderItems]
      summary: Fully update an order item
      operationId: updateOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '200':
          description: Order item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order item not found
    patch:
      tags: [OrderItems]
      summary: Partially update an order item
      operationId: patchOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemPatchRequest'
      responses:
        '200':
          description: Order item patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order item not found
    delete:
      tags: [OrderItems]
      summary: Delete an order item
      operationId: deleteOrderItem
      responses:
        '204':
          description: Order item deleted
        '404':
          description: Order item not found

  /api/orders/{orderId}/items:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OrderItems]
      summary: Get all items belonging to an order
      operationId: getItemsByOrder
      responses:
        '200':
          description: A list of order items for the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order not found

  /api/books:
    get:
      tags: [Books]
      summary: Get all books
      operationId: getAllBooks
      parameters:
        - name: title
          in: query
          required: false
          description: Filter by title (partial, case-insensitive)
          schema:
            type: string
        - name: author
          in: query
          required: false
          description: Filter by author (partial, case-insensitive)
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: Filter by category
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          description: "e.g. price,asc or title,desc"
          schema:
            type: string
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
    post:
      tags: [Books]
      summary: Add a new book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Books]
      summary: Get a book by ID
      operationId: getBookById
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Books]
      summary: Fully update a book
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
        '404':
          description: Book not found
    patch:
      tags: [Books]
      summary: Partially update a book
      operationId: patchBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatchRequest'
      responses:
        '200':
          description: Book patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
    delete:
      tags: [Books]
      summary: Delete a book
      operationId: deleteBook
      responses:
        '204':
          description: Book deleted successfully
        '404':
          description: Book not found

  /api/categories:
    get:
      tags: [Categories]
      summary: Get all categories
      operationId: getAllCategories
      responses:
        '200':
          description: A list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      summary: Get a category by ID
      operationId: getCategoryById
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    put:
      tags: [Categories]
      summary: Fully update a category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    patch:
      tags: [Categories]
      summary: Partially update a category
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Category patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
        '409':
          description: Category still has books assigned and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{categoryId}/books:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      summary: Get all books belonging to a category
      operationId: getBooksByCategory
      responses:
        '200':
          description: A list of books in the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '404':
          description: Category not found

components:
  schemas:
    UserRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        address:
          type: string
        role:
          type: string
          enum: [ADMIN, AUTHOR, CUSTOMER]
          default: CUSTOMER
        enabled:
          type: boolean
          default: true

    UserPatchRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        address:
          type: string
        role:
          type: string
          enum: [ADMIN, AUTHOR, CUSTOMER]
        enabled:
          type: boolean

    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        address:
          type: string
        role:
          type: string
          enum: [ADMIN, AUTHOR, CUSTOMER]
        enabled:
          type: boolean

    OrderRequest:
      type: object
      required: [userId, items]
      properties:
        userId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemLine'

    OrderItemLine:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1

    OrderPatchRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, COMPLETED, SHIPPED, CANCELED]

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        orderDate:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, COMPLETED, SHIPPED, CANCELED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    OrderItemRequest:
      type: object
      required: [orderId, bookId, quantity, unitPrice]
      properties:
        orderId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          format: double
          minimum: 0.01

    OrderItemPatchRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          format: double
          minimum: 0.01

    OrderItemResponse:
      type: object
      properties:
        orderItemId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
          format: double

    BookRequest:
      type: object
      required: [title, author, price, quantity]
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        price:
          type: number
          format: double
          minimum: 0.01
        quantity:
          type: integer
          format: int32
          minimum: 0
        description:
          type: string
        imgURL:
          type: string
          format: uri
        categoryId:
          type: string
          format: uuid

    BookPatchRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        price:
          type: number
          format: double
          minimum: 0.01
        quantity:
          type: integer
          format: int32
          minimum: 0
        description:
          type: string
        imgURL:
          type: string
          format: uri
        categoryId:
          type: string
          format: uuid

    BookResponse:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        price:
          type: number
          format: double
        quantity:
          type: integer
          format: int32
        description:
          type: string
        imgURL:
          type: string
          format: uri
        categoryId:
          type: string
          format: uuid

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string

    CategoryPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string

    CategoryResponse:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string