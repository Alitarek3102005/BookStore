openapi: 3.0.3
info:
  title: Bookstore REST API
  description: API contract for the Spring Boot Bookstore System, matching the ERD and pagination/search features.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

security:
  - bearerAuth: []

tags:
  - name: Users
    description: User registration and management
  - name: Orders
    description: Order processing and checkout
  - name: OrderItems
    description: Individual line items within an order
  - name: Books
    description: Book catalog management
  - name: Categories
    description: Category management for books
  - name: Carts
    description: Shopping cart management and analytics
  - name: CartItems
    description: Individual items within a shopping cart
  - name: Reviews
    description: User reviews and ratings for books
paths:
  /api/users:
    get:
      tags: [Users]
      summary: Get all users with search, filter, and pagination
      operationId: getAllUsers
      parameters:
        - name: keyword
          in: query
          required: false
          description: Filter by username or email (partial, case-insensitive)
          schema:
            type: string
        - name: role
          in: query
          required: false
          description: Filter by role
          schema:
            type: string
            enum: [ADMIN, CUSTOMER]
        - name: enabled
          in: query
          required: false
          description: Filter by account status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          description: "e.g. username,asc"
          schema:
            type: string
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      tags: [Users]
      summary: Register a new user
      operationId: createUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      summary: Get a user by ID
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Users]
      summary: Fully update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    patch:
      tags: [Users]
      summary: Partially update a user
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: User patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found

  /api/carts:
    get:
      tags: [Carts]
      summary: Get all active carts (Admin analytics)
      operationId: getAllCarts
      responses:
        '200':
          description: A list of all carts in the system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartResponse'

  /api/users/{userId}/cart:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Carts]
      summary: Get or create the active cart for a user
      operationId: getOrCreateCart
      responses:
        '200':
          description: User's cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Carts]
      summary: Clear all items from a user's cart
      operationId: clearCart
      responses:
        '204':
          description: Cart cleared successfully
        '404':
          description: Cart not found

  /api/users/{userId}/cart/items:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Carts]
      summary: Add a book to the user's cart
      operationId: addItemToCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Item added successfully (returns updated cart)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: Book or User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient stock for the requested quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart-items/{cartItemId}:
    parameters:
      - name: cartItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [CartItems]
      summary: Update the quantity of a specific cart item
      operationId: updateCartItemQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemPatchRequest'
      responses:
        '200':
          description: Cart item updated successfully (returns updated cart)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient stock for the requested quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [CartItems]
      summary: Remove an item entirely from the cart
      operationId: removeCartItem
      responses:
        '204':
          description: Cart item removed successfully
        '404':
          description: Cart item not found

  /api/users/{userId}/checkout:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Orders]
      summary: Checkout a user's cart and convert it to an Order
      operationId: checkoutUserCart
      responses:
        '201':
          description: Order created successfully from cart items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Cart is empty or invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient stock for one or more items in the cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders:
    get:
      tags: [Orders]
      summary: Get all orders with filtering and pagination
      operationId: getAllOrders
      parameters:
        - name: customerId
          in: query
          required: false
          description: Filter orders by specific user
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter orders by status
          schema:
            type: string
            enum: [PENDING, COMPLETED, SHIPPED, CANCELED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
    post:
      tags: [Orders]
      summary: Place a new direct order (Buy it Now)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Orders]
      summary: Get an order by ID
      operationId: getOrderById
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
    put:
      tags: [Orders]
      summary: Fully update an order
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
    patch:
      tags: [Orders]
      summary: Partially update an order (e.g. status)
      operationId: patchOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPatchRequest'
      responses:
        '200':
          description: Order patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
    delete:
      tags: [Orders]
      summary: Cancel or delete an order
      operationId: deleteOrder
      responses:
        '204':
          description: Order deleted successfully
        '404':
          description: Order not found

  /api/orders/{orderId}/pay:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Orders]
      summary: Pay for an order and transition its status to SHIPPED
      operationId: payOrder
      responses:
        '200':
          description: Order paid and shipped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Order is not in a valid state for payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{userId}/orders:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Orders]
      summary: Get all orders for a specific user with pagination
      operationId: getOrdersByUser
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of orders belonging to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: User not found

  /api/order-items:
    get:
      tags: [OrderItems]
      summary: Get all order items
      operationId: getAllOrderItems
      responses:
        '200':
          description: A list of order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItemResponse'
    post:
      tags: [OrderItems]
      summary: Create a new order item
      operationId: createOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '201':
          description: Order item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'

  /api/order-items/{orderItemId}:
    parameters:
      - name: orderItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OrderItems]
      summary: Get an order item by ID
      operationId: getOrderItemById
      responses:
        '200':
          description: Order item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order item not found
    put:
      tags: [OrderItems]
      summary: Fully update an order item
      operationId: updateOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '200':
          description: Order item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order item not found
    patch:
      tags: [OrderItems]
      summary: Partially update an order item
      operationId: patchOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemPatchRequest'
      responses:
        '200':
          description: Order item patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order item not found
    delete:
      tags: [OrderItems]
      summary: Delete an order item
      operationId: deleteOrderItem
      responses:
        '204':
          description: Order item deleted
        '404':
          description: Order item not found

  /api/orders/{orderId}/items:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OrderItems]
      summary: Get all items belonging to an order
      operationId: getItemsByOrder
      responses:
        '200':
          description: A list of order items for the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItemResponse'
        '404':
          description: Order not found

  /api/books:
    get:
      tags: [Books]
      summary: Get all books
      operationId: getAllBooks
      security: []
      parameters:
        - name: title
          in: query
          required: false
          description: Filter by title (partial, case-insensitive)
          schema:
            type: string
        - name: author
          in: query
          required: false
          description: Filter by author (partial, case-insensitive)
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: Filter by category
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          description: "e.g. price,asc or title,desc"
          schema:
            type: string
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
    post:
      tags: [Books]
      summary: Add a new book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Books]
      summary: Get a book by ID
      operationId: getBookById
      security: []
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Books]
      summary: Fully update a book
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
        '404':
          description: Book not found
    patch:
      tags: [Books]
      summary: Partially update a book
      operationId: patchBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatchRequest'
      responses:
        '200':
          description: Book patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
    delete:
      tags: [Books]
      summary: Delete a book
      operationId: deleteBook
      responses:
        '204':
          description: Book deleted successfully
        '404':
          description: Book not found

  /api/books/{bookId}/reviews:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reviews]
      summary: Get all reviews for a specific book with pagination
      operationId: getReviewsByBook
      security: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: rating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'
        '404':
          description: Book not found
    post:
      tags: [Reviews]
      summary: Add a new review to a book
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Validation error
        '404':
          description: Book or User not found
        '409':
          description: User has already reviewed this book

  /api/reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Reviews]
      summary: Partially update a review (e.g. rating or comment)
      operationId: patchReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPatchRequest'
      responses:
        '200':
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '404':
          description: Review not found
    delete:
      tags: [Reviews]
      summary: Delete a review
      operationId: deleteReview
      responses:
        '204':
          description: Review deleted successfully
        '404':
          description: Review not found

  /api/categories:
    get:
      tags: [Categories]
      summary: Get all categories with search and pagination
      operationId: getAllCategories
      security: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: Search by name or description
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      summary: Get a category by ID
      operationId: getCategoryById
      security: []
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    put:
      tags: [Categories]
      summary: Fully update a category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    patch:
      tags: [Categories]
      summary: Partially update a category
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Category patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
        '409':
          description: Category still has books assigned and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{categoryId}/books:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      summary: Get all books belonging to a category
      operationId: getBooksByCategory
      security: []
      responses:
        '200':
          description: A list of books in the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '404':
          description: Category not found

